services:
  - type: web
    name: lookbook
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/reader-data
      sizeGB: 1
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /opt/render/project/reader-data/reader.db
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: NEXT_PUBLIC_ADSENSE_CLIENT
        sync: false
      - key: NEXT_PUBLIC_BAIDU_UNION_ID
        sync: false
      - key: BQ_ENABLED
        value: "false"
